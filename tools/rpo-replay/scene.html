<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cosmos 2612 / ICEYE-X36 replay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=block" rel="stylesheet">
<link href="/cesium/Widgets/widgets.css" rel="stylesheet">
<style>
  :root {
    --x36: #5ce1e6;
    --cosmos: #ff5a3c;
    --burn: #ffb547;
    --ink: #eef2f6;
    --ink-2: rgba(238, 242, 246, 0.66);
    --ink-3: rgba(238, 242, 246, 0.38);
    --rule: rgba(238, 242, 246, 0.16);
    --u: 1px; /* layout unit, scaled per format */
  }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: Inter, system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #globe { position: absolute; inset: 0; }
  .cesium-viewer-bottom, .cesium-widget-credits { display: none !important; }
  #hud { position: absolute; inset: 0; pointer-events: none; }
  #vignette { position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,0.55) 100%); }
  #topshade { position: absolute; left: 0; right: 0; top: 0; height: calc(380 * var(--u));
    background: linear-gradient(rgba(0,0,0,0.55), transparent); }
  #botshade { position: absolute; left: 0; right: 0; bottom: 0; height: calc(420 * var(--u));
    background: linear-gradient(transparent, rgba(0,0,0,0.72)); }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-feature-settings: 'tnum' 1, 'zero' 0; }

  #caption { position: absolute; left: calc(64 * var(--u)); top: calc(56 * var(--u)); width: calc(760 * var(--u)); }
  #caption .kicker { font: 600 calc(15 * var(--u))/1.2 'JetBrains Mono', monospace; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--ink-2); margin-bottom: calc(14 * var(--u)); }
  #caption .kicker b { color: var(--ink); font-weight: 600; }
  #caption h1 { margin: 0 0 calc(14 * var(--u)); font: 700 calc(46 * var(--u))/1.04 Inter, sans-serif; letter-spacing: -0.02em; }
  #caption p { margin: 0; font: 400 calc(21 * var(--u))/1.42 Inter, sans-serif; color: var(--ink-2); }
  #caption p em { font-style: normal; color: var(--ink); font-weight: 500; }
  .c-x36 { color: var(--x36) !important; }
  .c-cos { color: var(--cosmos) !important; }
  .c-burn { color: var(--burn) !important; }

  #clock { position: absolute; right: calc(64 * var(--u)); top: calc(56 * var(--u)); text-align: right; }
  #clock .date { font: 600 calc(30 * var(--u))/1 'JetBrains Mono', monospace; letter-spacing: -0.01em; }
  #clock .time { font: 400 calc(22 * var(--u))/1 'JetBrains Mono', monospace; color: var(--ink-2); margin-top: calc(10 * var(--u)); }
  #clock .rate { margin-top: calc(18 * var(--u)); display: inline-flex; gap: calc(10 * var(--u)); align-items: baseline;
    font: 500 calc(17 * var(--u))/1 'JetBrains Mono', monospace; color: var(--ink); padding: calc(8 * var(--u)) calc(12 * var(--u));
    border: 1px solid var(--rule); border-radius: calc(4 * var(--u)); background: rgba(0,0,0,0.28); }
  #clock .rate span { color: var(--ink-2); }
  #clock .shadow { margin-top: calc(12 * var(--u)); font: 600 calc(14 * var(--u))/1 'JetBrains Mono', monospace;
    letter-spacing: 0.12em; color: #9fb4ff; }

  #readout { position: absolute; right: calc(64 * var(--u)); bottom: calc(262 * var(--u)); text-align: right; }
  #readout .label { font: 600 calc(13 * var(--u))/1 'JetBrains Mono', monospace; letter-spacing: 0.16em; color: var(--ink-2); }
  #readout .val { font: 600 calc(64 * var(--u))/1 'JetBrains Mono', monospace; letter-spacing: -0.03em; margin-top: calc(8 * var(--u)); }
  #readout .val small { font-size: 0.45em; color: var(--ink-2); margin-left: 0.15em; letter-spacing: 0; }
  #readout .ric { margin-top: calc(10 * var(--u)); font: 400 calc(15 * var(--u))/1.5 'JetBrains Mono', monospace; color: var(--ink-2); }
  #readout .ric b { color: var(--ink); font-weight: 500; }

  #chart { position: absolute; left: calc(64 * var(--u)); right: calc(64 * var(--u)); bottom: calc(44 * var(--u)); height: calc(190 * var(--u)); }
  #chart svg { width: 100%; height: 100%; overflow: visible; }
  #chart text { font-family: 'JetBrains Mono', monospace; }

  .tag { position: absolute; transform: translate(0, -50%); white-space: nowrap; }
  .tag .name { font: 600 calc(17 * var(--u))/1.1 Inter, sans-serif; letter-spacing: 0.01em; }
  .tag .meta { font: 400 calc(13 * var(--u))/1.3 'JetBrains Mono', monospace; color: var(--ink-2); margin-top: calc(3 * var(--u)); }
  #leaders { position: absolute; inset: 0; width: 100%; height: 100%; }

  #callouts { position: absolute; left: calc(64 * var(--u)); top: calc(330 * var(--u)); width: calc(700 * var(--u)); }
  .event { position: relative; padding-left: calc(22 * var(--u)); margin-bottom: calc(14 * var(--u));
    font: 600 calc(16 * var(--u))/1.2 'JetBrains Mono', monospace; letter-spacing: 0.08em; }
  .event i { position: absolute; left: 0; top: calc(4 * var(--u)); width: calc(9 * var(--u)); height: calc(9 * var(--u)); border-radius: 50%; }
  .event .sub { font-weight: 400; letter-spacing: 0.02em; color: var(--ink-2); margin-top: calc(5 * var(--u)); font-size: calc(14 * var(--u)); }
  #mag { position: absolute; left: calc(64 * var(--u)); bottom: calc(262 * var(--u));
    font: 400 calc(14 * var(--u))/1.4 'JetBrains Mono', monospace; color: var(--ink-3); }

  #endcard { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #endcard .panel { width: calc(1180 * var(--u)); }
  #endcard h2 { margin: 0 0 calc(28 * var(--u)); font: 700 calc(44 * var(--u))/1.1 Inter, sans-serif; letter-spacing: -0.02em; }
  #endcard .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: calc(24 * var(--u)); margin-bottom: calc(36 * var(--u)); }
  #endcard .stat .n { font: 600 calc(48 * var(--u))/1 'JetBrains Mono', monospace; letter-spacing: -0.03em; }
  #endcard .stat .l { margin-top: calc(10 * var(--u)); font: 400 calc(16 * var(--u))/1.35 Inter, sans-serif; color: var(--ink-2); }
  #endcard .src { font: 400 calc(14 * var(--u))/1.6 'JetBrains Mono', monospace; color: var(--ink-3); border-top: 1px solid var(--rule); padding-top: calc(18 * var(--u)); }
  #endcard .src b { color: var(--ink-2); font-weight: 500; }

  /* Portrait */
  body.portrait #caption { left: calc(56 * var(--u)); right: calc(56 * var(--u)); top: calc(170 * var(--u)); width: auto; }
  body.portrait #caption h1 { font-size: calc(54 * var(--u)); }
  body.portrait #caption p { font-size: calc(25 * var(--u)); }
  body.portrait #clock { left: calc(56 * var(--u)); right: auto; top: calc(64 * var(--u)); text-align: left; display: flex; gap: calc(22 * var(--u)); align-items: baseline; flex-wrap: wrap; width: calc(968 * var(--u)); }
  body.portrait #clock .time { margin-top: 0; }
  body.portrait #clock .rate { margin-top: 0; margin-left: auto; }
  body.portrait #clock .shadow { margin-top: 0; width: 100%; text-align: right; }
  body.portrait #callouts { left: calc(56 * var(--u)); top: calc(560 * var(--u)); }
  body.portrait #readout { right: auto; left: calc(56 * var(--u)); bottom: calc(400 * var(--u)); text-align: left; }
  body.portrait #readout .val { font-size: calc(76 * var(--u)); }
  body.portrait #mag { left: auto; right: calc(56 * var(--u)); bottom: calc(400 * var(--u)); text-align: right; }
  body.portrait #chart { left: calc(56 * var(--u)); right: calc(56 * var(--u)); bottom: calc(110 * var(--u)); height: calc(250 * var(--u)); }
  body.portrait #topshade { height: calc(820 * var(--u)); }
  body.portrait #botshade { height: calc(880 * var(--u)); }
  body.portrait #endcard .panel { width: calc(940 * var(--u)); }
  body.portrait #endcard .stats { grid-template-columns: repeat(2, 1fr); gap: calc(34 * var(--u)); }
  body.portrait #endcard h2 { font-size: calc(52 * var(--u)); }
  body.portrait #endcard .stat .n { font-size: calc(60 * var(--u)); }
  body.portrait #endcard .stat .l { font-size: calc(20 * var(--u)); }
  body.portrait #endcard .src { font-size: calc(17 * var(--u)); }
</style>
</head>
<body>
<div id="globe"></div>
<div id="hud">
  <div id="vignette"></div>
  <div id="topshade"></div>
  <div id="botshade"></div>
  <svg id="leaders"></svg>
  <div id="tags"></div>
  <div id="callouts"></div>
  <div id="caption"><div class="kicker"></div><h1></h1><p></p></div>
  <div id="clock"><div class="date mono"></div><div class="time mono"></div><div class="rate"></div><div class="shadow"></div></div>
  <div id="readout"><div class="label">SEPARATION</div><div class="val"></div><div class="ric"></div></div>
  <div id="mag"></div>
  <div id="chart"></div>
  <div id="endcard"></div>
  <div id="dip" style="position:absolute;inset:0;background:#000;opacity:0"></div>
</div>
<script src="/cesium/Cesium.js"></script>
<script type="module" src="scene.js"></script>
</body>
</html>
